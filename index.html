#lbn{color:#94a3b8;font-size:11px;margin-top:.45rem;letter-spacing:2.5px;font-weight:700}
.lbbtn{position:fixed;background:rgba(255,255,255,.13);color:#fff;border:none;width:54px;height:54px;

#lbprev{left:26px;top:50%;transform:translateY(-50%)}
#lbnext{right:26px;top:50%;transform:translateY(-50%)}

<script>
/* ============================================================
   ១. ទិន្នន័យខ្លឹមសារ (Content model) — ស្រង់ចេញពីរបាយការណ៍ដើម
   ============================================================ */

const OBJECTIVES = [
 {n:'ទី១', t:'ក្របខណ្ឌគោលនយោបាយជាតិ', icon:'⚖️', tag:'អភិបាលកិច្ច',
  sum:'តម្រូវឱ្យអនុវត្ត «គោលនយោបាយជាតិស្តីពីសុខភាពសិក្សា» និង «សំណុំសកម្មភាព ៩ ចំណុច» ឱ្យបាន ១០០% នៅតាមគ្រឹះស្ថានសិក្សាគោលដៅ។',
  body:[

const DB={
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open('shReport',1);
    r.onupgradeneeded=()=>{ r.result.createObjectStore('kv'); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async get(k){
    try{ const db=await DB.open();
      return await new Promise(res=>{ const q=db.transaction('kv').objectStore('kv').get(k);
        q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); });
    }catch(e){ try{ return JSON.parse(localStorage.getItem('sh_'+k)||'null'); }catch(_){ return null; } }
  },
  async set(k,v){
    try{ const db=await DB.open();
      await new Promise((res,rej)=>{ const q=db.transaction('kv','readwrite').objectStore('kv').put(v,k);
        q.onsuccess=res; q.onerror=()=>rej(q.error); });
      return true;
    }catch(e){ try{ localStorage.setItem('sh_'+k,JSON.stringify(v)); return true; }catch(_){ return false; } }
  }
};

let saveT=null;
function queueSave(){ clearTimeout(saveT); saveT=setTimeout(()=>{ DB.set('media',MEDIA); DB.set('texts',TEXTS); },600); }

function ytId(u){ const m=String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{11})/); return m?m[1]:null; }

function mediaHTML(m){
  if(!m) return EMPTYBOX;
  const st='class="w-full rounded-lg object-cover" style="height:118px"';
  if(m.t==='image') return '<img src="'+m.src+'" alt="'+(m.lab||'')+'" '+st+'>';
  if(m.t==='video') return '<video src="'+m.src+'" preload="metadata" muted playsinline '+st
      +' style="height:118px;background:#000;object-fit:cover"></video><span class="mbadge">▶ វីដេអូ</span>';
  if(m.t==='yt') return '<img src="https://img.youtube.com/vi/'+m.id+'/mqdefault.jpg" alt="YouTube" '+st
      +'><span class="mbadge">▶ YouTube</span>';
  if(m.t==='pdf') return '<div class="pdfcard"><div style="font-size:26px;line-height:1">📄</div>'
      +'<div class="text-[9.5px] font-bold" style="word-break:break-all">'+(m.name||'PDF')+'</div></div>'
      +'<span class="mbadge">PDF</span>';
  return EMPTYBOX;
}

function renderSlot(box){
  const m=MEDIA[box.dataset.sid];
  box.innerHTML=mediaHTML(m);
  if(m) box.dataset.has='1'; else delete box.dataset.has;
  const del=box.closest('.picwrap').querySelector('.pic-del');
  if(del) del.classList.toggle('hidden',!m);
  refreshSlots();
}
function refreshSlots(){
  document.querySelectorAll('.mslot').forEach(a=>{
    const b=a.querySelector('.picbox');
    a.style.display=(EDIT||(b&&b.dataset.has))?'':'none';
  });
}

function shrink(src,cb){
  const im=new Image();
  im.onload=function(){
    const M=1600; let w=im.width,h=im.height;
    if(Math.max(w,h)>M){ const k=M/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(im,0,0,w,h);
    try{ cb(c.toDataURL('image/jpeg',0.82)); }catch(e){ cb(src); }
  };
  im.onerror=function(){ cb(src); };
  im.src=src;
}

function putMedia(box,m){ MEDIA[box.dataset.sid]=Object.assign({lab:box.dataset.lab||''},m); renderSlot(box); queueSave(); }

function addFile(box,f){
  if(!f) return;
  const r=new FileReader();
  r.onload=function(){
    if(f.type.indexOf('image/')===0) shrink(r.result,u=>putMedia(box,{t:'image',src:u,name:f.name}));
    else if(f.type.indexOf('video/')===0) putMedia(box,{t:'video',src:r.result,name:f.name});
    else if(f.type==='application/pdf') putMedia(box,{t:'pdf',src:r.result,name:f.name});
    else alert('ប្រភេទឯកសារមិនគាំទ្រ — សូមប្រើរូបភាព វីដេអូ ឬ PDF');
  };
  r.readAsDataURL(f);
}
function addURL(box,u){
  u=String(u).trim(); if(!u) return;
  const y=ytId(u);
  if(y) putMedia(box,{t:'yt',id:y,src:'https://www.youtube.com/embed/'+y});
  else if(/\.pdf($|\?)/i.test(u)) putMedia(box,{t:'pdf',src:u,name:u.split('/').pop().split('?')[0]});
  else if(/\.(mp4|webm|ogg|mov|m4v)($|\?)/i.test(u)) putMedia(box,{t:'video',src:u});
  else putMedia(box,{t:'image',src:u});
}
function clearMedia(btn){
  const box=btn.closest('.picwrap').querySelector('.picbox');
  delete MEDIA[box.dataset.sid]; renderSlot(box); queueSave();
}
function pickFile(btn){ picTarget=btn.closest('.picwrap').querySelector('.picbox'); document.getElementById('picFile').click(); }
function pickURL(btn){
  const u=prompt('បញ្ចូល URL (រូបភាព · វីដេអូ · YouTube · PDF)៖');
  if(u) addURL(btn.closest('.picwrap').querySelector('.picbox'),u);
}

SEC.push({id:'phases',t:'ដំណើរការសកម្មភាព ៣ ដំណាក់កាល',html:`
<p class="muted text-[13px] mb-5 leading-[2.1]">ដំណើរការនៃការប្រែក្លាយសាលារៀនទៅជាប្រព័ន្ធអេកូឡូស៊ីសុខភាព ត្រូវបានអនុវត្តតាមរយៈវិធីសាស្ត្រផ្លាស់ប្តូរជាប្រព័ន្ធ (Systemic Change Approach) ដែលបែងចែកជា ៣ ដំណាក់កាលធំៗ។ ការបែងចែកពេលវេលានេះឆ្លុះបញ្ចាំងពីទ្រឹស្តីនៃការផ្លាស់ប្តូរ (Theory of Change) ដែលចាប់ផ្តើមពីការរៀបចំរចនាសម្ព័ន្ធអភិបាលកិច្ច ឆ្លងទៅការកែប្រែឥរិយាបថ និងបញ្ចប់ដោយការវាយតម្លៃផលធៀប។</p>

SEC.push({id:'star',t:'អភិក្រមផ្កាយបី (Three Star Approach)',html:`

    <div class="text-[11px] muted mb-2">កម្ពុជាបានបង្កើនយ៉ាងលឿននូវសមាមាត្រសាលារៀនដែលមានសេវាអនាម័យកម្រិតមូលដ្ឋាន</div>

SEC.push({id:'me',t:'ការវាស់វែង លទ្ធផល និងការវាយតម្លៃ',html:`

SEC.push({id:'concl',t:'សេចក្តីសន្និដ្ឋាន',html:`
<div class="card p-8 md:p-10" style="border-top:5px solid var(--accent)">
 <div class="space-y-4 text-[13.5px] leading-[2.2]">
  <p>ផែនការសកម្មភាព «ការកសាងប្រព័ន្ធសុខភាពសិក្សាគ្រប់ជ្រុងជ្រោយ និងការលើកកម្ពស់ចលនាកីឡាសាលារៀន» មិនមែនត្រឹមតែជាក្របខណ្ឌប្រតិបត្តិការធម្មតានោះទេ ប៉ុន្តែគឺជាសរសរស្តម្ភដ៏មានអានុភាព ក្នុងការជំរុញគុណភាពវិស័យអប់រំនៅកម្ពុជាឱ្យស្របតាមបរិបទនៃតម្រូវការអភិវឌ្ឍន៍សកល។</p>
  <p>ការប្រែក្លាយសាលារៀនពីមជ្ឈមណ្ឌលផ្ទេរចំណេះដឹងទ្រឹស្តីសុទ្ធសាធ ឱ្យទៅជាប្រព័ន្ធអេកូឡូស៊ីដែលគាំទ្រយ៉ាងពេញលេញដល់ការអភិវឌ្ឍបញ្ញាស្មារតី កាយសម្បទា និងសុខភាពផ្លូវចិត្ត គឺជាយុទ្ធសាស្ត្រផ្លូវរាងដ៏ឆ្លាតវៃក្នុងការដោះស្រាយបញ្ហាស្នូលនៃវិស័យអប់រំ និងសុខភាពសាធារណៈ។</p>
  <p>តាមរយៈការអនុវត្តម៉ឺងម៉ាត់នូវ «សំណុំសកម្មភាព ៩ ចំណុច» ការវិភាគបន្ថែមសេចក្តីណែនាំលេខ ៧១ ស្តីពីចំណីអាហារនិងភេសជ្ជៈ ការប្រញាប់ប្រញាល់អភិក្រមផ្កាយបី (Three Star Approach) លើផ្នែកអនាម័យទឹកស្អាត និងការតម្រូវឱ្យមានម៉ោងកីឡាប្រចាំសប្តាហ៍ សាលារៀននឹងក្លាយជាទីជម្រកសុវត្ថិភាពដែលបណ្តុះទម្លាប់រស់នៅប្រចាំជីវិត។</p>
  <p>ភាពជោគជ័យ និងនិរន្តរភាពនៃប្រព័ន្ធនេះ ផ្អែកទាំងស្រុងលើការប្រកាន់ខ្ជាប់នូវក្របខណ្ឌវាយតម្លៃតាម «ស្តង់ដាសាលារៀនគំរូ» ដែលពឹងផ្អែកលើទិន្នន័យជាក់ស្តែង និងការទទួលខុសត្រូវរួមគ្នារវាងគណៈគ្រប់គ្រងសាលា អាជ្ញាធរ អង្គការដៃគូ និងសហគមន៍មាតាបិតា។</p>
  <p class="font-bold pri">ការវិនិយោគលើវប្បធម៌គ្រូបង្រៀនជា «វិស្វករនៃព្រលឹង» និងការផ្លាស់ប្តូរទម្លាប់សង្គម នឹងបន្សល់ទុកនូវកេរដំណែលនៃធនធានមនុស្សជំនាន់ថ្មីរបស់កម្ពុជា ដែលមិនត្រឹមតែមានចំណេះដឹងជ្រៅជ្រះប៉ុណ្ណោះទេ ប៉ុន្តែថែមទាំងមានសុខុមាលភាពរឹងមាំ ភាពធន់នឹងវិបត្តិ និងត្រៀមខ្លួនរួចជាស្រេចក្នុងការប្រកួតប្រជែងនៅក្នុងបរិបទសេដ្ឋកិច្ចសកល។</p>

/* ---- mount ---- */
$('#main').innerHTML = SEC.map(s=>`<section id="${s.id}" class="scroll-mt-24">
  <h2 class="moul text-lg md:text-xl pri mb-5 flex items-center gap-3">
    <span class="inline-block w-8 h-[3px]" style="background:var(--accent)"></span>${s.t}</h2>${s.html}</section>`).join('');
$('#tocList').innerHTML = SEC.map((s,i)=>`<a class="tocl" href="#${s.id}">${String(i+1).padStart(2,'0')} · ${s.t}</a>`).join('');

/* ============================================================
   ៣. Interactions
   ============================================================ */
function allAcc(open){ $$('.acc').forEach(a=>a.classList.toggle('open',open)); }

/* ===== មេឌា និងការកែសម្រួល ===== */
$('#picFile').addEventListener('change',e=>{
  const f=e.target.files[0];
  if(f && picTarget) addFile(picTarget,f);
  picTarget=null; e.target.value='';
});
document.addEventListener('click',e=>{
  const dz=e.target.closest && e.target.closest('.dz-empty');
  if(dz && EDIT){ e.stopPropagation(); picTarget=dz.closest('.picbox'); $('#picFile').click(); }
},true);
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{
  const b=e.target.closest && e.target.closest('.picbox');
  if(b && EDIT){ e.preventDefault(); b.classList.add('drag'); }
}));
document.addEventListener('dragleave',e=>{
  const b=e.target.closest && e.target.closest('.picbox');
  if(b) b.classList.remove('drag');
});
document.addEventListener('drop',e=>{
  const b=e.target.closest && e.target.closest('.picbox');
  if(!b || !EDIT) return;
  e.preventDefault(); b.classList.remove('drag');
  addFile(b, e.dataTransfer && e.dataTransfer.files[0]);
});

/* ---- កែអត្ថបទ ---- */
const INLINE={SPAN:1,EM:1,B:1,STRONG:1,I:1,A:1,BR:1,SMALL:1,CODE:1,MARK:1};
function markTexts(){
  let n=0;
  $$('#main *').forEach(el=>{
    if(el.dataset.eid) return;
    if(el.closest('.picwrap,.chartbox,.caret,#lb')) return;
    if(el.tagName==='BUTTON'||el.tagName==='CANVAS'||el.tagName==='SVG') return;
    if(!el.textContent.trim()) return;
    if(el.parentElement && el.parentElement.closest('[data-eid]')) return;
    for(const c of el.children) if(!INLINE[c.tagName]) return;
    el.dataset.eid='t'+(++n);
  });
  return n;
}
function applyTexts(){
  Object.keys(TEXTS).forEach(id=>{
    const el=document.querySelector('[data-eid="'+id+'"]');
    if(el) el.innerHTML=TEXTS[id];
  });
}
function setEdit(on){
  EDIT=!!on;
  document.body.classList.toggle('edit',EDIT);
  $$('#main [data-eid]').forEach(el=>el.setAttribute('contenteditable',EDIT?'true':'false'));
  const b=$('#btnEdit'); if(b){ b.classList.toggle('on',EDIT); b.textContent=EDIT?'✅ រួចរាល់':'✏️ កែសម្រួល'; }
  refreshSlots();
}
document.addEventListener('input',e=>{
  const el=e.target.closest && e.target.closest('[data-eid]');
  if(el && EDIT){ TEXTS[el.dataset.eid]=el.innerHTML; queueSave(); }
});
document.addEventListener('click',e=>{
  if(!EDIT) return;
  const el=e.target.closest && e.target.closest('[data-eid]');
  if(el) e.stopPropagation();
},true);

/* ---- ទាញយកឯកសារពេញ ---- */
async function exportHtml(){
  const btn=$('#btnExport'); const old=btn.textContent; btn.textContent='កំពុងរៀបចំ…';
  try{
    const src=await fetch(location.pathname,{cache:'no-store'}).then(r=>r.text());
    const inject='<scr'+'ipt>window.__MEDIA='+JSON.stringify(MEDIA)+';window.__TEXTS='+JSON.stringify(TEXTS)
      +';if(window.applySaved)window.applySaved();</scr'+'ipt>\n';
    const out=src.replace('</body>',inject+'</body>');
    const blob=new Blob([out],{type:'text/html;charset=utf-8'});
    const mb=(blob.size/1048576).toFixed(1);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='index.html'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    if(blob.size>20*1048576) alert('ឯកសារធំ '+mb+' MB — GitHub ទទួលបានតែ ២៥ MB តាមរយៈ Upload។ សូមប្រើ URL សម្រាប់វីដេអូវិញ។');
  }catch(err){ alert('ទាញយកមិនបាន៖ '+err); }
  btn.textContent=old;
}
$('#btnExport').onclick=exportHtml;

/* search */
const q=$('#q'), qn=$('#qn');
q.addEventListener('input',()=>{
  const t=q.value.trim();
  $$('mark').forEach(m=>m.replaceWith(document.createTextNode(m.textContent)));
  $('#main').normalize();
  if(t.length<2){qn.textContent='';return;}
  let n=0;
  const walk=document.createTreeWalker($('#main'),NodeFilter.SHOW_TEXT);
  const hits=[]; let node;
  while(node=walk.nextNode()){ if(node.nodeValue.includes(t)) hits.push(node); }
  hits.forEach(nd=>{
    const parts=nd.nodeValue.split(t); const frag=document.createDocumentFragment();
    parts.forEach((p,i)=>{ frag.appendChild(document.createTextNode(p));
      if(i<parts.length-1){const m=document.createElement('mark');m.textContent=t;frag.appendChild(m);n++;} });
    nd.parentNode.replaceChild(frag,nd);
  });
  $$('mark').forEach(m=>{const a=m.closest('.acc'); if(a)a.classList.add('open');});
  qn.textContent = n?`ជួប ${n} កន្លែង`:'រកមិនឃើញ';
  const first=$('mark'); if(first) first.scrollIntoView({block:'center'});
});

  $('#prog').style.width=pct+'%'; $('#readStat').textContent='អានរួច '+Math.round(pct)+'%';

},{passive:true});

<div id="lb" class="noprint" role="dialog" aria-label="មើលពេញអេក្រង់">
  <div id="lbbody"></div>
  <div id="lbcap"></div>
  <div id="lbn"></div>
  <button class="lbbtn" id="lbprev" aria-label="មុន">&#8249;</button>
  <button class="lbbtn" id="lbnext" aria-label="បន្ទាប់">&#8250;</button>
  <button class="lbbtn" id="lbclose" aria-label="បិទ">&#10005;</button>
</div>
<script>
(function(){
  var lb=document.getElementById('lb'), bd=document.getElementById('lbbody'),
      lc=document.getElementById('lbcap'), ln=document.getElementById('lbn');
  var list=[], idx=0;
  function collect(){ list=Array.prototype.slice.call(document.querySelectorAll('.picbox[data-has]')); }
  function inner(m){
    if(!m) return '';
    if(m.t==='image') return '<img src="'+m.src+'" alt="">';
    if(m.t==='video') return '<video src="'+m.src+'" controls autoplay playsinline></video>';
    if(m.t==='yt')    return '<iframe src="https://www.youtube.com/embed/'+m.id+'?autoplay=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>';
    if(m.t==='pdf')   return '<iframe src="'+m.src+'"></iframe>';
    return '';
  }
  function show(i){
    if(!list.length) collect();
    if(!list.length) return;
    idx=(i+list.length)%list.length;
    var box=list[idx], m=window.getMedia(box.dataset.sid);
    bd.innerHTML=inner(m);
    lc.textContent=(m&&(m.lab||m.name))||'';
    ln.textContent=(idx+1)+' / '+list.length;
    lb.classList.add('on'); document.body.style.overflow='hidden';
  }
  function close(){ lb.classList.remove('on'); document.body.style.overflow=''; bd.innerHTML=''; }
  document.addEventListener('click',function(e){
    if(document.body.classList.contains('edit')) return;
    var box=e.target.closest && e.target.closest('.picbox[data-has]');
    if(box){ e.preventDefault(); e.stopPropagation(); collect(); show(list.indexOf(box)); }
  },true);
  document.getElementById('lbclose').onclick=function(e){e.stopPropagation();close();};
  document.getElementById('lbprev').onclick=function(e){e.stopPropagation();show(idx-1);};
  document.getElementById('lbnext').onclick=function(e){e.stopPropagation();show(idx+1);};
  lb.addEventListener('click',function(e){ if(e.target===lb) close(); });
  window.addEventListener('keydown',function(e){
    if(!lb.classList.contains('on')) return;
    if(e.key==='Escape') close();
    else if(e.key==='ArrowLeft'){ e.preventDefault(); show(idx-1); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); show(idx+1); }
  });
})();
</script>
